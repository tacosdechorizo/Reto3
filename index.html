<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Reto 3</title>
    <link rel="stylesheet" href="estilos/estilos.css">
</head>
<body>
    <div class="form-container">
        <h1 id="titulo-formulario">Registro de usuario</h1>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>
            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" required>
            </div>
            <div class="form-group">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" required>
            </div>
            
            <div class="form-group">
                <label for="descripcion">Breve descripción sobre ti:</label>
                <textarea id="descripcion" name="descripcion" rows="4"></textarea>
            </div>
            
            <div class="form-group checkbox-group">
                <p class="label-intereses">Intereses:</p>
                <label><input type="checkbox" name="intereses" value="Tecnología"> Tecnología</label>
                <label><input type="checkbox" name="intereses" value="Arte"> Arte</label>
                <label><input type="checkbox" name="intereses" value="Deporte"> Deporte</label>
            </div>
            
            <button type="submit" class="btn-submit">Registrarse</button>
        </form>
    </div>
</body>
</html>
